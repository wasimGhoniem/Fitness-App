name: Code Check & Tests (on Push or PR)

on:
  push:
    branches:
      - '**'
  pull_request:
    types: [opened, edited]
    branches:
      - '**'

jobs:
  analyze_and_test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Print Dart and Flutter versions
        run: |
          dart --version
          flutter --version

      # ✅ إنشاء ملف .env وهمي
      - name: Create dummy .env file if not exists
        run: |
          if [ ! -f ".env" ]; then
            echo "Creating dummy .env file..."
            echo "API_URL=https://example.com" >> .env
            echo "SUPABASE_URL=https://dummy.supabase.co" >> .env
            echo "SUPABASE_KEY=dummy_key" >> .env
          else
            echo ".env file already exists"
          fi

      - name: Install dependencies
        run: flutter pub get

      # 🧩 تشغيل build_runner
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 🌍 توليد ملفات الترجمة
      - name: Generate localization files
        run: |
          flutter pub run easy_localization:generate -S assets/translations -O lib/core/localization
          flutter pub run easy_localization:generate -S assets/translations -O lib/core/localization -f keys -o locale_keys.g.dart

      # 🔍 تحليل الكود
      - name: Analyze code
        run: flutter analyze

      # ✨ تنسيق الكود
      - name: Format code
        run: dart format --set-exit-if-changed .

      # 🧪 تشغيل Unit Tests + تغطية
      - name: Run tests with coverage
        run: flutter test --coverage

      # 📊 رفع ملف التغطية كـ artifact (اختياري)
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
