name: fitness_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  dio: ^5.9.0
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  flutter_svg: ^2.0.10+1
  flutter_timer_countdown: ^1.0.7
  get_it: ^8.2.0
  injectable: ^2.5.1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.4.0
  responsive_framework: ^1.5.1
  easy_localization: ^3.0.8
  image_picker: ^1.2.0
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  pinput: ^5.0.1
  bloc_test: ^10.0.0
  equatable: ^2.0.7
  cupertino_icons: ^1.0.8
  firebase_ai: ^3.3.0
  firebase_database: ^12.0.3
  skeletonizer: ^2.1.0+1
  blurbox: ^0.0.6
  blur: ^4.0.2
  flutter_dotenv: ^5.0.2
  numberpicker: ^2.1.2
  percent_indicator: ^4.2.5
  shimmer: ^3.0.0
  youtube_player_flutter: ^9.1.3
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.11
  test: ^1.25.15
  json_serializable: ^6.10.0
  retrofit_generator: ^10.0.4
  injectable_generator: ^2.5.1
  mockito: ^5.5.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - .env
  fonts:
    - family: BalooThambi2
      fonts:
        - asset: assets/fonts/BalooThambi2-Bold.ttf
          weight: 700
        - asset: assets/fonts/BalooThambi2-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/BalooThambi2-Medium.ttf
          weight: 500
        - asset: assets/fonts/BalooThambi2-Regular.ttf
          weight: 400
        - asset: assets/fonts/BalooThambi2-SemiBold.ttf
          weight: 600

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400


flutter_assets:
  assets_path:
    - assets/images/
    - assets/icons/
  output_path: lib\core\utils\constants\
  filename: app_assets.dart
 